{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="card shadow mt-4">

        <div class="card-header bg-warning">

            <h3>Edit Member</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-success">
                    Save Changes
                </button>

                <a href="/members/" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
